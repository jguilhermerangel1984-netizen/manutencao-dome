<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manutenção Predial Dome</title>
<meta name="theme-color" content="#001e62">
<style>
:root{
  /* Layout: barra lateral fixa com o menu + área de trabalho; no celular o menu vira uma faixa rolável no topo. */
  --bg:#f1f4f9; --surface:#ffffff; --surface-2:#f6f8fc; --ink:#0b1a3b; --muted:#55627f; --line:#d8dfeb;
  --side:#001e62; --side-ink:#dbe5ff; --side-active:#0a2f80;
  --primary:#001e62; --on-primary:#ffffff; --accent:#00bbdc; --accent-soft:#e0f6fa; --bar:#00a5c4;
  --ok:#176f43; --ok-bg:#e2f3e9; --warn:#8a5a00; --warn-bg:#fcefd2; --info:#1b56b3; --info-bg:#e3ecfb;
  --bad:#a8231c; --bad-bg:#fbe5e3; --wait:#5546ad; --wait-bg:#ebe8fa;
  --font-display:"DIN Next","DIN Next LT Pro",Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif;
  --font-body:"DIN Next","DIN Next LT Pro",Calibri,Carlito,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(11,26,59,.06),0 4px 14px rgba(11,26,59,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a111e; --surface:#121b2d; --surface-2:#182338; --ink:#e7ecf7; --muted:#9ba8c2; --line:#27344e;
    --side:#0c1730; --side-ink:#cfd9f5; --side-active:#1a2b55;
    --primary:#00bbdc; --on-primary:#001e62; --accent:#00bbdc; --accent-soft:#12303a; --bar:#6f9bf0;
    --ok:#6fd39c; --ok-bg:#12301f; --warn:#f0c064; --warn-bg:#35280c; --info:#8fb6ff; --info-bg:#14254a;
    --bad:#ff9c93; --bad-bg:#3a1512; --wait:#b9adff; --wait-bg:#221c47;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a111e; --surface:#121b2d; --surface-2:#182338; --ink:#e7ecf7; --muted:#9ba8c2; --line:#27344e;
  --side:#0c1730; --side-ink:#cfd9f5; --side-active:#1a2b55;
  --primary:#00bbdc; --on-primary:#001e62; --accent:#00bbdc; --accent-soft:#12303a; --bar:#6f9bf0;
  --ok:#6fd39c; --ok-bg:#12301f; --warn:#f0c064; --warn-bg:#35280c; --info:#8fb6ff; --info-bg:#14254a;
  --bad:#ff9c93; --bad-bg:#3a1512; --wait:#b9adff; --wait-bg:#221c47;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.1} h2{font-size:21px} h3{font-size:17px}
p{margin:0} img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.hidden{display:none !important}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:14px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:8px;padding:2px 6px 10px}
.brand .logo{width:150px;display:block}
.brand .logo img{display:block;width:100%}
.brand b{font-family:var(--font-display);font-size:19px;font-weight:600;color:#fff;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a svg{flex:none;width:18px;height:18px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 #00bbdc}
.nav .badge{margin-left:auto}
.badge{background:#2fc3e2;color:#04222b;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.side .who{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:12px 6px 0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.side .who b{color:#fff;font-size:14px}
.side .who button{background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:8px 10px;color:#fff;cursor:pointer;text-align:left}
.side .who button:hover{background:rgba(255,255,255,.18)}
.main{overflow-y:auto;padding:22px 26px 60px;min-width:0}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--muted);margin-top:2px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){
  .shell{display:flex;flex-direction:column}
  .side{flex-direction:row;align-items:center;gap:10px;padding:8px 12px;overflow:visible;flex:none}
  .brand{flex-direction:row;align-items:center;padding:0;flex:none}
  .brand .logo{width:84px} .brand b{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:8px 10px;white-space:nowrap}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 #2fc3e2}
  .nav a svg{display:none}
  .side .who{margin:0;border:0;padding:0;flex:none}
  .side .who .lbl{display:none}
  .main{padding:16px 16px 70px}
  h1{font-size:24px}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card > .body{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--font-display);white-space:nowrap;font-size:clamp(22px,2.4vw,30px);font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.st{border-left:4px solid var(--c,var(--line))}
a.kpi:hover{border-color:var(--accent)}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;font-size:14px}
.banner.info{background:var(--info-bg);color:var(--info)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:4px}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn.ghost{background:transparent}
.btn.big{min-height:50px;font-size:16px;padding:12px 18px}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field > label,.field > .lab{font-weight:600;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-height:40px}
textarea{min-height:76px;resize:vertical}
.form{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters > *{flex:1 1 150px;max-width:260px}
.filters .btn{flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip small{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.yn{display:inline-flex;gap:6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.aguardando{background:var(--wait-bg);color:var(--wait);border-color:transparent}
.pill.pendente{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.andamento{background:var(--info-bg);color:var(--info);border-color:transparent}
.pill.realizado{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.recusada,.pill.urgente,.pill.atrasada{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.alta{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.col > header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:3px solid var(--c);font-family:var(--font-display);font-size:17px;font-weight:600}
.col .list{display:flex;flex-direction:column;gap:8px;padding:10px}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%;border-left:4px solid var(--c,var(--line))}
.svc:hover{border-color:var(--accent);border-left-color:var(--c,var(--accent))}
.svc .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.svc .n{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--muted)}
.svc .d{font-weight:600;overflow-wrap:anywhere}
.svc .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.stack{display:flex;flex-direction:column;gap:10px}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;text-align:left;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .d{overflow-wrap:anywhere;min-width:180px;display:block}

/* charts */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;align-items:end;height:170px;border-bottom:1px solid var(--line);background:linear-gradient(to top,transparent 49.6%,var(--line) 49.6%,var(--line) 50%,transparent 50%)}
.cols .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.cols .c i{display:block;width:min(46px,70%);background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.cols .c span{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.colx{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;font-size:12.5px;color:var(--muted);text-align:center;margin-top:5px}
.hbars{display:grid;grid-template-columns:minmax(90px,max-content) 1fr max-content;gap:7px 10px;align-items:center;font-size:14px}
.hbars .t{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0}
.hbars .t i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.hbars .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,12,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.modal.sm{width:min(460px,100%)}
.modal > header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.modal > .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal > footer{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line)}
.x{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
@media (max-width:560px){.overlay{padding:0}.modal{border-radius:0;min-height:100%}.modal > footer .btn{flex:1}}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.dl div{display:flex;flex-direction:column}
.dl dt,.dl .k{font-size:12.5px;color:var(--muted);font-weight:600}
.timeline{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);margin:5px 0 0 4px}
.timeline li.done::before{background:var(--ok)}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:8.5px;top:17px;bottom:0;width:1px;background:var(--line)}
.fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.foto{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.foto .cap{padding:6px 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.foto img{display:block;width:100%;height:210px;object-fit:contain;background:#0c1220}
.foto .ph{height:210px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.foto .c{padding:6px 10px;font-size:13px;color:var(--muted)}
.picker{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface-2)}
.picker img{max-height:220px;border-radius:8px}
.picker .bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mat{display:grid;grid-template-columns:1fr 78px 110px 34px;gap:6px;align-items:center}
.mat button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px}
@media (max-width:480px){.mat{grid-template-columns:1fr 60px 86px 30px}}
.sig{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.sig canvas,.sig img{width:100%;height:130px;background:#fff;border-radius:8px;border:1px solid var(--line);touch-action:none;display:block;object-fit:contain}
.sig .t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.choose button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.choose button:hover{border-color:var(--accent)}
.choose b{font-family:var(--font-display);font-size:20px;font-weight:600}
.choose span{color:var(--muted);font-size:14px}
.welcome{max-width:860px;margin:0 auto;padding:34px 18px;display:flex;flex-direction:column;gap:20px}
.welcome .logo{background:#001e62;border-radius:12px;padding:10px 16px;width:190px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;max-width:92vw;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.steps li.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}

.modal form footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.modal form footer .btn{flex:1}}

/* tela inicial e login */
.welcome.center{min-height:100%;justify-content:center;align-items:center;text-align:center;max-width:820px;gap:22px}
.welcome.center .wt{display:flex;flex-direction:column;gap:6px;align-items:center}
.welcome.center .logo{width:220px;padding:12px 18px}
.welcome.center .choose{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;text-align:left}
@media (max-width:620px){.welcome.center .choose{grid-template-columns:1fr}.welcome.center{justify-content:flex-start}}
.choose .ci{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.choose .ci svg{width:22px;height:22px}
.choose .acesso{font-style:normal;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:5px;align-items:center;margin-top:auto;padding-top:8px}
.choose .acesso svg{width:14px;height:14px}
.login{width:min(420px,100%);text-align:left}
.side .who b{overflow-wrap:anywhere}
@media (max-width:860px){.side .who{flex-direction:row}.hide-m{display:none !important}}

/* QR Code */
.qr-cartaz{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.qr-cartaz .qr-logo{width:150px}
.qr-cartaz .qr-img{width:min(280px,100%);border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.qr-cartaz .qr-img svg{display:block;width:100%;height:auto}
.qr-cartaz .qr-loc{font-size:17px}

/* PMOC */
.fs{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.fs legend{font-weight:700;font-size:13.5px;padding:0 4px}
.mat.prod{grid-template-columns:1fr 1fr 34px}
.chk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chk-i{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 10px;border-bottom:1px solid var(--line);align-items:center}
.chk-i:last-child{border-bottom:0}
.chk-i:nth-child(odd){background:var(--surface-2)}
.chk-t{font-size:14px;overflow-wrap:anywhere}
.chk-r{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.chk-r button{border:0;background:transparent;padding:8px 11px;font-weight:700;cursor:pointer;color:var(--muted);min-width:46px;min-height:38px}
.chk-r button.r-ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.chk-r button.r-nc[aria-pressed="true"]{background:var(--bad);color:#fff}
.chk-r button.r-na[aria-pressed="true"]{background:var(--muted);color:#fff}
.chk-nc{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk-nc input[type=text]{flex:1 1 220px}
@media (max-width:560px){.chk-i{grid-template-columns:1fr}.chk-r{justify-self:start}}
.crono table{font-size:12.5px}
.crono th,.crono td{padding:4px 5px}
.crono .stk{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:6px;font-weight:700;font-size:12px;border:1px solid transparent;cursor:pointer;font-variant-numeric:tabular-nums;padding:0 4px}
.cr[disabled]{cursor:default}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-atr{background:var(--bad-bg);color:var(--bad);border-color:currentColor}
.c-pen{background:var(--warn-bg);color:var(--warn);border-color:currentColor}
.c-fut{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.c-na{background:transparent;color:var(--muted)}
.c-late{border-color:var(--warn);border-style:dashed}
.chk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chk-head .btn{margin-left:auto}
.chk-g{margin-bottom:10px}
.chk-gh{display:flex;align-items:center;gap:8px;padding:4px 2px 6px}
.chk-gh .btn{margin-left:auto}
.eqinfo{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:14px}
.eqinfo img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.nom{font-weight:400;color:var(--muted);font-size:12px}
.ficha-top{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:start}
.ficha-qr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ficha-qr svg{width:150px;height:150px;background:#fff;border-radius:8px;padding:6px}
@media (max-width:560px){.ficha-top{grid-template-columns:1fr}}
.pub{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.pub-h{display:flex;gap:12px;align-items:center}
.pub-h img.logo{height:40px}
details summary{cursor:pointer}

/* ===== Resultados (apresentação) ===== */
.vz{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --vz-ok:#1baf7a;--vz-pen:#c9d3e3;--vz-atr:#e34948;--vz-na:transparent;position:relative;display:flex;flex-direction:column;gap:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--vz-ok:#199e70;--vz-pen:#34425e;--vz-atr:#e66767}}
:root[data-theme="dark"] .vz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--vz-ok:#199e70;--vz-pen:#34425e;--vz-atr:#e66767}
.vz-head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vz-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.vz-card h2{font-size:19px}
.vz-sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.vz-k{display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.vz-hero{display:grid;grid-template-columns:1.25fr 1fr 1fr 1.2fr;gap:14px}
.vz-big{position:relative;overflow:hidden;background:linear-gradient(135deg,#001e62 0%,#0a2f80 60%,#00bbdc 135%);color:#fff;border:0}
.vz-big .vz-k{color:#b9cdf5}
.vz-n{display:block;font-family:var(--font-display);font-size:64px;font-weight:600;line-height:1;margin:8px 0 6px}
.vz-delta{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
.vz-delta.up{background:rgba(27,175,122,.28)} .vz-delta.down{background:rgba(227,73,72,.3)}
.vz-spark{display:block;width:100%;height:46px;margin-top:12px}
.vz-spark-l{fill:none;stroke:#7fe3ff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.vz-spark-a{fill:rgba(127,227,255,.16)} .vz-spark-d{fill:#fff;stroke:#7fe3ff;stroke-width:2}
.vz-cap{font-size:11px;color:#b9cdf5}
.vz-gauge{display:flex;align-items:center;gap:14px}
.vz-ring{width:118px;height:118px;flex:none}
.vz-ring-bg{fill:none;stroke:var(--surface-2);stroke-width:11}
.vz-ring-fg{fill:none;stroke-width:11;stroke-linecap:round}
.vz-ring-v{font-family:var(--font-display);font-size:24px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.vz-gauge .vz-k{text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink);font-family:var(--font-display)}
.vz-mini{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-content:center}
.vz-n2{display:block;font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.1;margin-top:2px}
.vz-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.vz-grid:nth-of-type(odd) .vz-w2{order:0}
.vz-grid .vz-card:not(.vz-w2):first-child{order:0}
.vz-vazio{padding:28px 0;text-align:center}
/* colunas */
.vz-cols{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;align-items:end;height:250px;margin-top:14px;padding-top:6px}
.vz-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.vz-col-b{width:min(64%,56px);border-radius:7px 7px 3px 3px;background:var(--s1);opacity:.55;transform-origin:bottom}
.vz-col.atual .vz-col-b{opacity:.85}
.vz-col.best .vz-col-b{opacity:1;background:linear-gradient(180deg,#35bcd9,var(--s1));box-shadow:0 6px 18px -6px rgba(42,120,214,.7)}
.vz-col-v{font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:4px}
.vz-col-l{font-size:12px;color:var(--muted);margin-top:6px;text-transform:capitalize}
.vz-col:hover .vz-col-b{opacity:1}
/* barras por equipe */
.vz-hbars{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.vz-hb{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center}
.vz-hb-l{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vz-hb-t{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.vz-hb-b{display:block;height:100%;border-radius:999px;transform-origin:left}
.vz-hb-v{font-family:var(--font-display);font-weight:600;font-size:17px;min-width:2ch;text-align:right}
/* waffle */
.vz-waffle{display:grid;grid-template-columns:repeat(auto-fill,minmax(17px,1fr));gap:5px;margin-top:14px}
.vz-dot{display:inline-block;aspect-ratio:1;border-radius:50%;width:100%}
.vz-leg .vz-dot{width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.vz-ok{background:var(--vz-ok)} .vz-pendente{background:var(--vz-pen)} .vz-atrasado{background:var(--vz-atr)} .vz-na{border:1.5px dashed var(--muted)}
.vz-waffle .vz-dot:hover{transform:scale(1.35);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.vz-leg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.vz-leg b{color:var(--ink);margin-left:2px}
/* funil */
.vz-funil{display:flex;flex-direction:column;gap:10px;margin:16px 0 8px}
.vz-fe{position:relative;height:46px}
.vz-fe-b{position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:10px;transform-origin:left}
.vz-fe-b.s1{background:var(--s1);opacity:.35} .vz-fe-b.s2{background:var(--s1);opacity:.6} .vz-fe-b.s3{background:var(--s3)}
.vz-fe-t{position:relative;display:flex;align-items:center;gap:8px;height:100%;padding:0 12px;font-size:14px}
.vz-fe-t b{font-family:var(--font-display);font-size:22px}
/* ranking */
.vz-rank{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.vz-rank li{display:grid;grid-template-columns:24px minmax(70px,40%) 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.vz-rk{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:12px}
.vz-rank li:first-child .vz-rk{background:var(--s4);color:#1a1200}
.vz-rk-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.vz-rk-t{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.vz-rk-t span{display:block;height:100%;border-radius:999px;background:var(--s2);transform-origin:left}
/* destaques */
.vz-insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.vz-ins{border-left:4px solid var(--s1);background:var(--surface-2);border-radius:10px;padding:12px 14px}
.vz-ins:nth-child(2){border-color:var(--s3)} .vz-ins:nth-child(3){border-color:var(--s2)} .vz-ins:nth-child(4){border-color:var(--s7)}
.vz-ins-k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.vz-ins p{margin-top:4px;font-size:14.5px}
.vz-rodape{text-align:right}
.vz-tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.35;padding:7px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:260px}
/* animação de entrada */
.vz .vz-col-b{transform:scaleY(0);transition:transform .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.vz .vz-hb-b,.vz .vz-fe-b,.vz .vz-rk-t span{transform:scaleX(0);transition:transform .8s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.vz .vz-waffle .vz-dot{opacity:0;transform:scale(.3);transition:opacity .35s ease var(--d,0ms),transform .35s cubic-bezier(.3,1.6,.5,1) var(--d,0ms)}
.vz .vz-ring-fg{stroke-dashoffset:var(--dash);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.vz .vz-ins{opacity:0;transform:translateY(8px);transition:opacity .5s ease var(--d,0ms),transform .5s ease var(--d,0ms)}
.vz.vz-on .vz-col-b{transform:none} .vz.vz-on .vz-hb-b,.vz.vz-on .vz-fe-b,.vz.vz-on .vz-rk-t span{transform:none}
.vz.vz-on .vz-waffle .vz-dot{opacity:1;transform:none} .vz.vz-on .vz-ring-fg{stroke-dashoffset:var(--off)} .vz.vz-on .vz-ins{opacity:1;transform:none}
.vz.vz-on .vz-waffle .vz-dot:hover{transform:scale(1.35)}
@media (prefers-reduced-motion: reduce){.vz *{transition:none!important}}
@media (max-width:1100px){.vz-hero{grid-template-columns:1fr 1fr}.vz-grid{grid-template-columns:1fr}}
@media (max-width:560px){.vz-hero{grid-template-columns:1fr}.vz-n{font-size:52px}.vz-cols{height:200px}}
/* modo apresentação */
body.apresentar .side,body.apresentar .mtop,body.apresentar .vz-noprint{display:none!important}
body.apresentar .shell{grid-template-columns:1fr!important}
body.apresentar .main{padding:28px 40px;max-width:none}
body.apresentar .vz{zoom:1.12}
@media print{
  .side,.mtop,.vz-noprint,.vz-tip,#toast{display:none!important}
  .shell{display:block!important} .main{padding:0!important;overflow:visible!important;height:auto!important}
  body{background:#fff} .vz-card{box-shadow:none;break-inside:avoid}
  .vz .vz-col-b,.vz .vz-hb-b,.vz .vz-fe-b,.vz .vz-rk-t span,.vz .vz-waffle .vz-dot,.vz .vz-ins{transform:none!important;opacity:1!important;transition:none!important}
  .vz .vz-ring-fg{stroke-dashoffset:var(--off)!important;transition:none!important}
  .vz-big{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .vz *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:10mm}
}
body.apresentar .page{max-width:none}
.vz-head .btn svg{width:18px;height:18px}
.vz-hero{grid-template-columns:1.15fr 1fr 1fr 1.3fr}
.vz-ring{width:96px;height:96px}
.vz-gauge{gap:12px}
.vz-gauge .vz-k{font-size:17px;line-height:1.2}
.vz-mini .vz-n2{font-size:25px;white-space:nowrap}
.vz-mini .vz-k{font-size:11.5px}

/* bebedouros */
.beb-lista{display:grid;gap:10px}
.beb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-left:5px solid var(--c,var(--line));flex-wrap:wrap}
.beb-abre{all:unset;cursor:pointer;flex:1 1 320px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-width:0}
.beb-abre:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.beb-id{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--primary);white-space:nowrap}
.beb-loc{display:flex;flex-direction:column;min-width:0}
.beb-loc b{overflow-wrap:anywhere}
.beb-st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.beb-sit{display:flex;align-items:center;gap:14px;border-left:6px solid var(--c);background:var(--surface-2,#f4f7fb);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.beb-sit .v{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--c);white-space:nowrap;line-height:1}
.beb-chk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.beb-chk legend{display:flex;gap:10px;align-items:center;padding:0 6px}
.chk-l{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.3;cursor:pointer}
.chk-l input{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--primary)}
@media (max-width:640px){.beb-abre{grid-template-columns:auto 1fr}.beb-st{grid-column:1/-1;align-items:flex-start;text-align:left}.beb-item>.btn{width:100%}}
.seg label{display:flex;gap:6px;align-items:center;padding:8px 16px;cursor:pointer;font-weight:600}.seg label:has(input:checked){background:var(--primary);color:var(--on-primary)}.seg label input{accent-color:var(--accent)}

/* ---------- banco em memória (pré-visualização sem conexão) ---------- */
function mockDb() {
  const docs = new Map(); const subs = new Set();
  const notify = () => subs.forEach(f => setTimeout(f, 0));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const o = { ...a }; for (const k in b) o[k] = (isObj(b[k]) && isObj(a[k])) ? merge(a[k], b[k]) : b[k]; return o; };
  const snap = p => ({ id: p.split('/').pop(), exists: docs.has(p), data: () => docs.get(p), metadata: { fromCache: false } });
  const docRef = p => ({
    id: p.split('/').pop(), path: p,
    get: async () => snap(p),
    set: async d => { docs.set(p, JSON.parse(JSON.stringify(d))); notify(); },
    update: async d => { if (!docs.has(p)) throw { code: 'invalid_argument' }; docs.set(p, merge(docs.get(p), JSON.parse(JSON.stringify(d)))); notify(); },
    delete: async () => { docs.delete(p); notify(); },
    onSnapshot(next) { const f = () => next(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
  });
  const colRef = p => ({
    path: p, doc: id => docRef(p + '/' + (id || rid())),
    onSnapshot(next) {
      const n = p.split('/').length + 1;
      const f = () => { const ds = [...docs.keys()].filter(k => k.startsWith(p + '/') && k.split('/').length === n).map(snap); next({ docs: ds, size: ds.length, empty: !ds.length, metadata: { fromCache: false } }); };
      subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
    },
  });
  return { doc: docRef, collection: colRef };
}

function proximoNumero() {

/* ---------- fotos ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = src; }); }
async function comprimir(file, max = 1280, q = 0.74) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const dataUrlToBytes = d => { const b = atob(d.split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
async function enviarFoto(file) {
  let blob = await comprimir(file);
  if (S.assets) {
    try { const r = await S.assets.upload(blob, { type: 'image/jpeg' }); return { k: 'a', id: r.id }; }
    catch (e) { console.warn('upload', e); }
  }
  if (blob.size > 170000) blob = await comprimir(file, 900, 0.55);
  if (blob.size > 180000) blob = await comprimir(file, 640, 0.5);
  const ref = col('fotos').doc();
  await ref.set({ d: await blobToDataUrl(blob) });
  return { k: 'd', id: ref.id };
}
const fotoCache = new Map();
async function fotoSrc(f) {
  if (!f) return null;
  if (f.k === 'a') return '/_blob/' + f.id;
  if (fotoCache.has(f.id)) return fotoCache.get(f.id);
  const s = await S.db.doc('fotos/' + f.id).get(); const d = s.exists ? s.data().d : null;
  if (d) fotoCache.set(f.id, d); return d;
}
async function fotoBytes(f) {
  const src = await fotoSrc(f); if (!src) return null;
  if (src.startsWith('data:')) return dataUrlToBytes(src);
  try { const r = await fetch(src); if (r.ok) return new Uint8Array(await r.arrayBuffer()); } catch (e) { /* tenta pelo canvas */ }
  try {
    const img = await loadImg(src); const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0); return dataUrlToBytes(c.toDataURL('image/jpeg', 0.85));
  } catch (e) { return null; }
}
function hydrateFotos(root) {
  $$('img[data-foto]', root).forEach(async im => {
    const [k, id] = im.dataset.foto.split(':'); im.removeAttribute('data-foto');
    try { const src = await fotoSrc({ k, id }); if (src) im.src = src; else im.replaceWith(Object.assign(document.createElement('div'), { className: 'ph', textContent: 'Foto indisponível' })); }
    catch (e) { /* mantém vazio */ }
  });
}
const fotoTag = f => f ? `<img alt="" data-foto="${esc(f.k)}:${esc(f.id)}">` : '<div class="ph">Sem foto</div>';

/* ---------- avisos, modal, confirmação ---------- */
let toastT;
function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 4200);
}
let modalCleanup = null;
function openModal(html, cls = '') {
  closeModal();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o); hydrateFotos(o);
  const f = $('input:not([type=file]):not([type=hidden]),textarea,select', o); if (f && !cls.includes('nofocus')) f.focus({ preventScroll: true });
  return o;
}
function closeModal() { const o = $('#overlay'); if (o) o.remove(); if (modalCleanup) { modalCleanup(); modalCleanup = null; } }
function confirmar(titulo, texto, ok = 'Confirmar', perigo = false) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay'; o.style.zIndex = 70;
    o.innerHTML = `<div class="modal sm" role="alertdialog" aria-modal="true"><header><h2>${esc(titulo)}</h2></header><div class="body"><p>${esc(texto)}</p></div><footer><button class="btn" data-r="0">Cancelar</button><button class="btn ${perigo ? 'danger' : 'primary'}" data-r="1">${esc(ok)}</button></footer></div>`;
    o.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { o.remove(); res(b.dataset.r === '1'); } });
    document.body.appendChild(o); $('[data-r="1"]', o).focus();
  });
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Texto copiado. Cole no WhatsApp, Teams ou e-mail.'); }
  catch (e) { openModal(`<header><h2>Copie o texto</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></header><div class="body"><textarea id="cp-txt" rows="7" readonly>${esc(txt)}</textarea></div>`, 'sm'); const t = $('#cp-txt'); t.focus(); t.select(); }

async function baixar(filename, data) {
  if (S.downloads) {
    try { await S.downloads.save({ filename, data }); return true; }
    catch (e) { if (e && e.code === 'declined') return false; toast('Não foi possível baixar o arquivo nesta tela. Abra o app em tela cheia e tente de novo.'); return false; }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]); const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return true;
  } catch (e) { toast('Download indisponível nesta visualização.'); return false; }
}

  const tm = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : 0;
  const prevAtras = S.planos.filter(p => p.ativo !== false && p.proxima < dayStr()).length;

  if (urg) at.push([`${urg} ${urg === 1 ? 'serviço urgente ainda não foi iniciado' : 'serviços urgentes ainda não foram iniciados'}`, 'servicos']);
  const venc = S.servicos.filter(s => s.status === 'pendente' && s.prazo && s.prazo < dayStr()).length;
  if (venc) at.push([`${venc} ${venc === 1 ? 'serviço pendente está' : 'serviços pendentes estão'} com o prazo vencido`, 'servicos']);
  if (prevAtras) at.push([`${prevAtras} ${prevAtras === 1 ? 'manutenção programada está atrasada' : 'manutenções programadas estão atrasadas'}`, ro ? '' : 'preventivas']);

  const seg = (k, l, n) => `<button aria-pressed="${tab === k}" data-act="sol-tab" data-v="${k}">${l}${n != null ? ` <span class="num">(${n})</span>` : ''}</button>`;

}

/* ---------- Serviços ---------- */
function viewServicos() {
  if (S.modo === 'equipe') return viewServicosEquipe();
  const base = filtrar(S.servicos);
  const cols = [
    ['pendente', base.filter(s => s.status === 'pendente').sort(ordPend)],
    ['andamento', base.filter(s => s.status === 'andamento').sort((a, b) => String(a.iniciadoEm).localeCompare(String(b.iniciadoEm)))],
    ['realizado', base.filter(s => s.status === 'realizado').sort((a, b) => String(b.concluidoEm).localeCompare(String(a.concluidoEm)))],
  ];
  return `<div class="head"><div><h1>Serviços</h1><p>Clique em um serviço para ver quem pegou, quando iniciou, quando concluiu e as fotos.</p></div>
      ${S.modo === 'gestor' ? '<div class="acts"><button class="btn primary" data-act="novo-servico">Novo serviço</button></div>' : ''}</div>
    <div class="filters">
      <input type="search" id="f-busca" placeholder="Buscar por nº, descrição, local…" value="${esc(S.f.busca)}" data-f="busca" aria-label="Buscar">
      <select id="f-funcao" data-f="funcao" aria-label="Função"><option value="">Todas as funções</option>${optFuncoes(S.f.funcao)}</select>
      <select id="f-pessoa" data-f="pessoa" aria-label="Colaborador"><option value="">Toda a equipe</option>${optMembros(S.f.pessoa)}</select>
    </div>
    <div class="board">${cols.map(([st, l]) => `<section class="col" style="--c:${STATUS[st][2]}"><header><span>${STATUS[st][0]}</span><span class="tag num">${l.length}</span></header>
      <div class="list">${l.length ? l.slice(0, st === 'realizado' ? 15 : 200).map(svcCard).join('') : `<p class="muted small" style="padding:6px">Nenhum serviço.</p>`}
      ${st === 'realizado' && l.length > 15 ? `<a class="btn sm" href="#relatorios">Ver todos os ${l.length} em Relatórios</a>` : ''}</div></section>`).join('')}</div>`;
}
function viewServicosEquipe() {
  const eu = S.membro, m = membro(eu) || {};
  const meus = S.servicos.filter(s => s.status === 'andamento' && (s.executores || []).includes(eu));
  const pend = S.servicos.filter(s => s.status === 'pendente').sort(ordPend);
  const paraMim = pend.filter(s => (s.atribuidos || []).includes(eu) || (!(s.atribuidos || []).length && s.funcao === m.funcao));
  const outros = pend.filter(s => !paraMim.includes(s));
  const colegas = S.servicos.filter(s => s.status === 'andamento' && !(s.executores || []).includes(eu));
  const sec = (t, l, e) => `<section class="stack"><h2>${t} <span class="tag num">${l.length}</span></h2>${l.length ? l.map(svcCard).join('') : `<p class="muted">${e}</p>`}</section>`;
  return `<div class="head"><div><h1>Olá, ${esc((m.nome || '').split(' ')[0] || 'equipe')}</h1><p>Toque em um serviço para iniciar ou concluir. Terminou o seu? Pode pegar outro da lista.</p></div></div>
    ${sec('Em andamento comigo', meus, 'Você não tem serviço em andamento.')}
    ${sec('Para mim', paraMim, 'Nenhum serviço pendente da sua função agora.')}
    ${sec('Outros serviços disponíveis', outros, 'Não há outros serviços pendentes.')}
    ${colegas.length ? sec('Em andamento com colegas', colegas, '') : ''}`;
}
function viewHistorico() {
  const eu = S.membro;
  const l = S.servicos.filter(s => s.status === 'realizado' && (s.executores || []).includes(eu)).sort((a, b) => String(b.concluidoEm).localeCompare(String(a.concluidoEm)));
  const mes = l.filter(s => monthKey(s.concluidoEm) === monthKey(new Date())).length;
  return `<div class="head"><div><h1>Meus serviços concluídos</h1><p>Você concluiu <b>${mes}</b> ${mes === 1 ? 'serviço' : 'serviços'} neste mês e ${l.length} no total.</p></div></div>
    <div class="stack">${l.length ? l.slice(0, 60).map(svcCard).join('') : vazio('Nenhum serviço concluído ainda', 'Os serviços que você finalizar aparecem aqui.')}</div>`;
}

/* ---------- Preventivas ---------- */

  const l = [...S.planos].sort((a, b) => (a.ativo === false) - (b.ativo === false) || String(a.proxima).localeCompare(String(b.proxima)));

      ${l.map(p => { const [t, c] = planoSituacao(p); return `<tr><td><span class="d"><b>${esc(p.titulo)}</b>${p.exemplo ? ' <span class="tag">Exemplo</span>' : ''}${p.descricao ? `<br><span class="muted small">${esc(trunc(p.descricao, 110))}</span>` : ''}</span></td>

/* ---------- Relatórios ---------- */
function relFiltrados() {
  const q = S.f.busca.trim().toLowerCase();
  return S.servicos.filter(s => s.status === 'realizado' && s.concluidoEm
    && (!S.f.relMes || monthKey(s.concluidoEm) === S.f.relMes)
    && (!S.f.relFuncao || s.funcao === S.f.relFuncao)
    && (!S.f.relPessoa || (s.executores || []).includes(S.f.relPessoa))
    && (!S.f.relCliente || clienteDe(s) === S.f.relCliente)
    && (!q || [s.numero, s.descricao, s.atividade, s.local].some(v => String(v || '').toLowerCase().includes(q))))
    .sort((a, b) => String(b.concluidoEm).localeCompare(String(a.concluidoEm)));
}
function viewRelatorios() {
  const l = relFiltrados(); const custo = l.reduce((a, s) => a + (Number(s.custo) || 0), 0);

      <div class="acts"><button class="btn" data-act="csv" ${l.length ? '' : 'disabled'}>Exportar planilha</button><button class="btn primary" data-act="pdf-lote" ${l.length ? '' : 'disabled'}>Baixar PDF do período</button></div></div>
    <div class="filters">
      <input type="month" id="r-mes" value="${esc(S.f.relMes)}" data-f="relMes" aria-label="Mês">
      <select id="r-funcao" data-f="relFuncao" aria-label="Função"><option value="">Todas as funções</option>${optFuncoes(S.f.relFuncao)}</select>
      <select id="r-pessoa" data-f="relPessoa" aria-label="Colaborador"><option value="">Toda a equipe</option>${optMembros(S.f.relPessoa)}</select>
      <select id="r-cliente" data-f="relCliente" aria-label="Cliente"><option value="">Todos os clientes</option>${listaClientes().map(c => `<option${c === S.f.relCliente ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <input type="search" id="r-busca" placeholder="Buscar…" value="${esc(S.f.busca)}" data-f="busca" aria-label="Buscar">
      ${S.f.relMes ? '<button class="btn sm" data-act="rel-todos">Ver todos os meses</button>' : ''}
    </div>

    <div class="card"><div class="tw">${l.length ? `<table><thead><tr><th>Nº</th><th>Início</th><th>Término</th><th>Serviço</th><th>Local</th><th>Quem executou</th><th class="r">Materiais</th><th></th></tr></thead><tbody>
      ${l.map(s => `<tr><td class="num"><b>${esc(s.numero || '—')}</b></td><td class="num">${fmtD(s.iniciadoEm)}</td><td class="num">${fmtD(s.concluidoEm)}</td>
        <td><span class="d">${esc(trunc(s.atividade || s.descricao, 120))}${s.pend ? ' <span class="pill alta">Com pendência</span>' : ''}${s.exemplo ? ' <span class="tag">Exemplo</span>' : ''}</span></td>
        <td>${esc(s.local || '—')}</td><td>${esc((s.executores || []).map(i => nomeExec(s, i)).join(', ') || '—')}</td><td class="r">${s.custo ? brl(s.custo) : '—'}</td>
        <td style="white-space:nowrap"><button class="btn sm" data-act="abrir" data-id="${esc(s.id)}">Abrir</button> <button class="btn sm" data-act="pdf" data-id="${esc(s.id)}">PDF</button></td></tr>`).join('')}
      </tbody></table>` : vazio('Nenhum serviço concluído neste filtro', 'Troque o mês ou limpe os filtros.')}</div></div>`;
}

/* ---------- Produtividade ---------- */
function prodDados(k) {
  const rm = realizadosDoMes(k); const by = {};
  rm.forEach(s => (s.executores || []).forEach(id => {
    const o = by[id] || (by[id] = { id, nome: nomeExec(s, id), funcao: funcExec(s, id), n: 0, ms: 0 });
    o.n++; if (s.iniciadoEm) o.ms += Math.max(0, new Date(s.concluidoEm) - new Date(s.iniciadoEm));
  }));
  S.equipe.filter(m => m.ativo !== false && !by[m.id]).forEach(m => { by[m.id] = { id: m.id, nome: m.nome, funcao: m.funcao, n: 0, ms: 0 }; });
  const rows = Object.values(by).sort((a, b) => b.n - a.n || a.nome.localeCompare(b.nome));
  return { rm, rows, custo: rm.reduce((a, s) => a + (Number(s.custo) || 0), 0) };
}
function viewProdutividade() {
  const k = S.f.prodMes || monthKey(new Date()); const { rm, rows, custo } = prodDados(k);
  const max = Math.max(1, ...rows.map(r => r.n));
  const prev = (() => { const [y, m] = k.split('-').map(Number); return monthKey(new Date(y, m - 2, 1)); })();
  const ant = realizadosDoMes(prev).length;
  return `<div class="head"><div><h1>Produtividade</h1><p>Quanto cada colaborador produziu no mês. Serviço feito em dupla conta para os dois.</p></div>
      <div class="acts"><button class="btn primary" data-act="pdf-prod" ${rm.length ? '' : 'disabled'}>Baixar resumo do mês (PDF)</button></div></div>
    <div class="filters"><input type="month" id="p-mes" value="${esc(k)}" data-f="prodMes" aria-label="Mês"></div>
    <div class="kpis">
      <div class="kpi"><span class="v">${rm.length}</span><span class="l">Serviços realizados em ${esc(monthLabel(k))}</span></div>
      <div class="kpi"><span class="v">${ant}</span><span class="l">No mês anterior</span></div>
      <div class="kpi"><span class="v">${brl(custo)}</span><span class="l">Materiais gastos no mês</span></div>
      <div class="kpi"><span class="v">${rm.filter(s => s.pend).length}</span><span class="l">Concluídos com pendência</span></div>
    </div>
    <section class="card"><header><h3>Serviços realizados por colaborador</h3></header><div class="body">
      ${rows.length ? `<div class="hbars">${rows.map(r => `<span>${esc(r.nome)} <span class="muted small">${esc(r.funcao)}</span></span><span class="t" title="${esc(r.nome)}: ${r.n} ${r.n === 1 ? 'serviço' : 'serviços'}"><i style="width:${Math.round(r.n / max * 100)}%${r.n ? '' : ';min-width:0'}"></i></span><span class="v">${r.n}</span>`).join('')}</div>` : '<p class="muted">Cadastre a equipe para acompanhar a produção.</p>'}
    </div></section>
    <div class="card"><div class="tw">${rows.length ? `<table><thead><tr><th>Colaborador</th><th>Função</th><th class="r">Serviços realizados</th><th class="r">Tempo em serviço (início ao término)</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${esc(r.nome)}</b></td><td>${esc(r.funcao)}</td><td class="r">${r.n}</td><td class="r">${durTxt(r.ms)}</td></tr>`).join('')}</tbody></table>` : ''}</div></div>`;
}

      ${ms.length ? ms.map(m => { const n = rm.filter(s => (s.executores || []).includes(m.id)).length; const and = S.servicos.filter(s => s.status === 'andamento' && (s.executores || []).includes(m.id)).length;
        return `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b>${esc(m.nome)}</b>${m.ativo === false ? ' <span class="tag">Inativo</span>' : ''}${m.exemplo ? ' <span class="tag">Exemplo</span>' : ''}<br><span class="muted small">${n} ${n === 1 ? 'serviço' : 'serviços'} no mês${and ? ' · ' + and + ' em andamento' : ''}</span></div>

}

      <div class="stack"><span class="lab" style="font-weight:600;font-size:13.5px">Esqueceu a senha? Redefina o acesso da coordenação:</span>

  return `<div class="head"><div><h1>Solicitação de Manutenção Predial</h1><p>${c.codigoForm ? `<span class="tag">${esc(c.codigoForm)}</span> ` : ''}O pedido vai para aprovação e você acompanha a resposta em “Minhas solicitações”.</p></div></div>

function novoPad(mid, nome, salva) {
  const box = document.createElement('div'); box.className = 'sig'; box.dataset.mid = mid;
  const st = { box, drawn: false, usarSalva: !!salva, salva };
  const draw = () => {
    box.innerHTML = `<div class="t"><b>${esc(nome)}</b><span>${st.usarSalva ? '<button type="button" class="btn sm" data-sig="refazer">Assinar de novo</button>' : '<button type="button" class="btn sm" data-sig="limpar">Limpar</button>'}</span></div>`;
    if (st.usarSalva) { const im = new Image(); im.alt = 'Assinatura salva de ' + nome; im.src = st.salva; box.appendChild(im); box.insertAdjacentHTML('beforeend', '<span class="hint">Usando a assinatura salva.</span>'); return; }
    const c = document.createElement('canvas'); c.width = 600; c.height = 190; c.setAttribute('aria-label', 'Área para assinar: ' + nome); box.appendChild(c); st.canvas = c; st.drawn = false;
    box.insertAdjacentHTML('beforeend', '<span class="hint">Assine com o dedo ou o mouse. Em branco, o relatório sai com a linha para assinar à mão.</span>');
    const g = c.getContext('2d'); g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0b1a3b';
    let on = false; const p = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };

    c.addEventListener('pointerdown', e => { on = true; c.setPointerCapture(e.pointerId); const [x, y] = p(e); g.beginPath(); g.moveTo(x, y); mark(x, y); e.preventDefault(); });

async function submitConcluir(form) {
  const id = form.dataset.id, s = svc(id), v = fv(form), ex = chipsSel(form);

async function enviarArquivo(file) {
  const tipo = file.type === 'application/pdf' || /\.pdf$/i.test(file.name) ? 'application/pdf' : file.type;

  if (file.size > 180000) throw { code: 'x', message: 'Sem armazenamento de arquivos aqui: anexe um arquivo com menos de 180 KB.' };
  const ref = col('fotos').doc(); await ref.set({ d: await blobToDataUrl(file) }); return { k: 'd', id: ref.id, nome: file.name, tipo };
}

/* ---------- PDFs do PMOC ---------- */
async function novoPdf() {
  const { PDFDocument, StandardFonts } = PDFLib; const pdf = await PDFDocument.create();
  return { pdf, F: { reg: await pdf.embedFont(StandardFonts.Helvetica), bold: await pdf.embedFont(StandardFonts.HelveticaBold) }, logo: await pdf.embedPng(dataUrlToBytes(LOGO_NEG)) };
}
function folha(D, titulo, sub) {
  const st = { y: 10 };
  st.nova = () => { st.page = D.pdf.addPage([595.28, 841.89]); st.c = pdfCtx(st.page, D.F); st.y = 10;
    st.c.marca(D.logo, 10, 10, 42, 15, 1.8); st.c.cell(titulo, 52, 10, 106, 15, { bold: true, size: 12.5 }); st.c.cell(sub || '', 158, 10, 42, 15, { size: 7.5 }); st.y = 28; };
  st.precisa = h => { if (st.y + h > 284) st.nova(); };
  st.nova(); return st;
}
function secao(st, t) { st.precisa(14); st.y += 2; st.c.cell(t, 10, st.y, 190, 6, { bold: true, size: 9, fill: 'navy', white: true }); st.y += 6; }
function tabela(st, cols, rows, o = {}) {
  const size = o.size || 7.2, h = o.h || 5.2;
  const altura = r => { if (!o.auto) return h; let mx = 1; cols.forEach((cl, i) => { const n = wrapPdf(_fontes.reg, sane(String(r[i] ?? '')), size, cl.w * MM - 3).length; mx = Math.max(mx, n); }); return Math.max(h, mx * size * 1.2 / MM + 1.6); };
  const head = () => { let x = 10; cols.forEach(cl => { st.c.cell(cl.t, x, st.y, cl.w, h + 0.8, { bold: true, size, fill: true }); x += cl.w; }); st.y += h + 0.8; };
  st.precisa(h * 2 + 2); head();
  for (const r of rows) { const rh = Math.min(altura(r), 60); if (st.y + rh > 284) { st.nova(); head(); } let x = 10; cols.forEach((cl, i) => { st.c.cell(r[i] ?? '', x, st.y, cl.w, rh, { size, align: cl.a === 'c' ? undefined : 'left', pad: 1.2 }); x += cl.w; }); st.y += rh; }
}
let _fontes = null;
function paragrafo(st, t, o = {}) {
  const size = o.size || 8.2, font = o.bold ? _fontes.bold : _fontes.reg;
  for (const ln of wrapPdf(font, sane(t), size, 190 * MM - 4)) { st.precisa(size * 1.25 / MM + 0.4); st.page.drawText(ln, { x: 12 * MM, y: st.page.getHeight() - (st.y + size / MM) * MM, size, font, color: PDFLib.rgb(0.05, 0.08, 0.16) }); st.y += size * 1.25 / MM + 0.4; }
}
function kv(st, pares, colunas = 2) {
  const w = 190 / colunas; for (let i = 0; i < pares.length; i += colunas) { st.precisa(7.5); pares.slice(i, i + colunas).forEach((p, j) => { st.c.box(10 + j * w, st.y, w, 7.5); st.c.text(p[0], 10 + j * w, st.y, w, 3.2, { bold: true, size: 6.3, align: 'left', pad: 1.2 }); st.c.text(p[1] || '—', 10 + j * w, st.y + 2.6, w, 4.9, { size: 7.6, align: 'left', pad: 1.2 }); }); st.y += 7.5; }
}
function numerarPaginas(D, rotulo) {
  const pgs = D.pdf.getPages(), t = new Date().toLocaleString('pt-BR');
  pgs.forEach((p, i) => { const s = sane(`${rotulo} · gerado em ${t} · página ${i + 1} de ${pgs.length}`); p.drawText(s, { x: 10 * MM, y: 6 * MM, size: 6.5, font: D.F.reg, color: PDFLib.rgb(0.35, 0.4, 0.5) }); });
}

/* ficha de um registro */
async function fichaPmoc(D, r) {
  const st = folha(D, 'FICHA DE MANUTENÇÃO – PMOC', `${r.os || ''}\n${fmtD(r.data)}\n${r.tipo}`);
  identificacao(st);
  secao(st, 'Equipamento');
  kv(st, [['ID / TAG', `${r.equip} / ${r.tag || 'sem TAG'}`], ['Área / Setor', `${r.area} / ${r.setor}`], ['Tipo / Capacidade', `${r.tipoEq || '—'} / ${r.btu ? fmtNum(r.btu, 0) + ' BTU/h (' + fmtNum(tr(r.btu), 2) + ' TR)' : '—'}`], ['Marca', r.marca]], 4);
  secao(st, 'Execução');
  if (r.mesRef && r.mes && r.mesRef !== r.mes) paragrafo(st, `Preventiva da competência ${mkCurto(r.mesRef)} executada com atraso em ${fmtD(r.data)}.`);
  const m = r.med || {}, mv = (v, u) => v === '' || v == null ? '—' : fmtNum(v, 2) + ' ' + u;
  kv(st, [['Data e hora', fmtDH(r.data)], ['Situação', r.status], ['Executado por (DOME)', (r.tecNomes || []).join(', ')], ['Técnico externo', r.tecExterno]], 4);
  kv(st, [['Condição geral do equipamento', r.condicao || '—'], ['Ficou funcionando normalmente?', r.funcionando || '—'], ['Competência (mês do cronograma)', r.mesRef ? mkCurto(r.mesRef) : r.mes ? mkCurto(r.mes) : '—']], 3);
  kv(st, [['Tensão', mv(m.tensao, 'V')], ['Corrente', mv(m.corrente, 'A')], ['Pressão de sucção', mv(m.pressao, 'psi')], ['Temp. insuflamento', mv(m.tIns, '°C')], ['Temp. retorno', mv(m.tRet, '°C')]], 5);

    const logo = await pdf.embedPng(dataUrlToBytes(LOGO_NEG)), INK = rgb(0, 30 / 255, 98 / 255), CY = rgb(0, 187 / 255, 220 / 255), MUT = rgb(0.3, 0.35, 0.45);
    const W = 595.28, H = 841.89, mg = 10 * MM, gx = 6 * MM, gy = 4 * MM, lw = (W - 2 * mg - gx) / 2, lh = (H - 2 * mg - 3 * gy) / 4;

      page.drawText(sane('quem fez e a próxima data.'), { x: tx, y: yT - lh + 3.6 * MM, size: 6.8, font: F.reg, color: MUT });
    });

function resDados() {
  const n = +S.f.resPer || 6, agora = new Date(), at = monthKey(agora);
  const meses = []; for (let i = n - 1; i >= 0; i--) meses.push(mkAdd(at, -i));
  const mesesAnt = meses.map(k => mkAdd(k, -n));
  const dentro = (iso, ks) => iso && ks.includes(monthKey(iso));
  const concl = S.servicos.filter(s => s.status === 'realizado' && dentro(s.concluidoEm, meses));
  const conclAnt = S.servicos.filter(s => s.status === 'realizado' && dentro(s.concluidoEm, mesesAnt));
  const recebidos = S.servicos.filter(s => dentro(s.criadoEm, meses));
  const dur = s => new Date(s.concluidoEm) - new Date(s.criadoEm);
  const durs = concl.map(dur).filter(v => v >= 0);
  const em48 = durs.filter(v => v <= 48 * 36e5).length;
  // 12 meses fixos para as minicurvas
  const m12 = []; for (let i = 11; i >= 0; i--) m12.push(mkAdd(at, -i));
  const porMes = meses.map(k => S.servicos.filter(s => s.status === 'realizado' && s.concluidoEm && monthKey(s.concluidoEm) === k));
  const funcoes = (S.config.funcoes || []).slice();
  concl.forEach(s => { if (s.funcao && !funcoes.includes(s.funcao)) funcoes.push(s.funcao); });
  const porEquipe = funcoes.map((f, i) => ({ f, i, n: concl.filter(s => s.funcao === f).length })).filter(x => x.n || (S.config.funcoes || []).includes(x.f));
  const locais = {}; concl.forEach(s => { const l = (s.local || 'Sem local').split(' – ')[0].trim(); locais[l] = (locais[l] || 0) + 1; });
  const topLocais = Object.entries(locais).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const prevent = concl.filter(s => s.origem === 'preventiva' || /preventiva/i.test(s.tipo || '')).length;
  return {
    n, meses, at, concl, conclAnt, recebidos, durs, em48, porMes, porEquipe, topLocais, prevent,
    aprovados: recebidos.filter(s => !['aguardando', 'recusada'].includes(s.status)).length,

function animarResultados() {

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { root.classList.add('vz-on'); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('vz-on')));
  $$('[data-count]', root).forEach(el => {
    const fim = +el.dataset.count, suf = el.dataset.suf || ''; if (!fim && fim !== 0 || el.dataset.count === '') return;

    const passo = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(fim * e) + suf; if (p < 1) requestAnimationFrame(passo); };

}

const SESSAO_DIAS = { equipe: 30, gestor: 7, acompanhar: 7, solicitante: 365 };

const b64 = u8 => btoa(String.fromCharCode(...u8));

async function derivar(senha, saltB64) {
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' }, key, 256);
  return b64(new Uint8Array(bits));
}
async function novoRegistroSenha(senha) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  return { salt, hash: await derivar(senha, salt), alteradaEm: new Date().toISOString() };
}
async function conferirSenha(id, senha) {
  const d = await S.db.doc('acessos/' + id).get();
  if (!d.exists || !d.data().hash) return { ok: senha === SENHA_PADRAO, primeiro: true };
  const r = d.data(); return { ok: (await derivar(senha, r.salt)) === r.hash, primeiro: false };
}

function desenharCartaz(pdf, F, logo, url, local) {

  const lw = 210, lh = lw * logo.height / logo.width, bandH = lh + 50; page.drawRectangle({ x: 0, y: H - bandH, width: W, height: bandH, color: INK }); page.drawImage(logo, { x: (W - lw) / 2, y: H - 25 - lh, width: lw, height: lh });

const erroSb = e => ({ code: (e && (e.code === '42501' || /row-level security|permission|not allowed|sem permiss/i.test(e.message || ''))) ? 'invalid_argument' : 'unavailable', message: (e && e.message) || String(e) });
const colDe = p => p.split('/').slice(0, -1).join('/');
const ehObj = v => v && typeof v === 'object' && !Array.isArray(v);
const mesclar = (a, b) => { const o = { ...a }; for (const k in b) o[k] = (ehObj(b[k]) && ehObj(a[k])) ? mesclar(a[k], b[k]) : b[k]; return o; };
const snapDoc = (p, d) => ({ id: p.split('/').pop(), exists: d != null, data: () => (d == null ? undefined : d), metadata: { fromCache: false, hasPendingWrites: false } });
const papelDe = u => ((u && u.app_metadata) || {}).manut_papel || '';

function supaDb() {
  const logado = () => !!S.authUser;
  const ouvintes = new Set();
  const avisar = c => ouvintes.forEach(f => f(c));
  async function lerDoc(p) {
    const { data, error } = await SB.from(T_DOCS).select('data').eq('path', p).maybeSingle();
    if (error) throw erroSb(error); return data ? data.data : null;
  }
  async function lerCol(c) {
    if (!logado()) {
      if (c !== 'servicos') return [];
      const ids = minhasIds(); if (!ids.length) return [];
      const { data, error } = await SB.rpc('manut_minhas_solicitacoes', { ids }); if (error) throw erroSb(error); return data || [];
    }
    const { data, error } = await SB.from(T_DOCS).select('path,data').eq('col', c).limit(10000);
    if (error) throw erroSb(error); return data || [];
  }
  const ok = () => { if (S.ready && S.lento) { S.lento = false; queueRender(); } };
  const docRef = p => ({
    id: p.split('/').pop(), path: p,
    async get() { return snapDoc(p, await lerDoc(p)); },
    async set(d) {
      const row = { path: p, col: colDe(p), data: d, updated_at: new Date().toISOString() };
      const { error } = logado() ? await SB.from(T_DOCS).upsert(row) : await SB.from(T_DOCS).insert(row);
      if (error) throw erroSb(error); avisar(row.col);
    },
    async update(d) {
      const atual = await lerDoc(p); if (atual == null) throw { code: 'invalid_argument', message: 'Documento não encontrado' };
      const { data, error } = await SB.from(T_DOCS).update({ data: mesclar(atual, d), updated_at: new Date().toISOString() }).eq('path', p).select('path');
      if (error) throw erroSb(error); if (!data || !data.length) throw { code: 'invalid_argument', message: 'Sem permissão para alterar' };
      avisar(colDe(p));
    },
    async delete() { const { error } = await SB.from(T_DOCS).delete().eq('path', p); if (error) throw erroSb(error); avisar(colDe(p)); },
    onSnapshot(next, err) {
      const run = async () => { try { next(snapDoc(p, await lerDoc(p))); ok(); } catch (e) { console.warn(e); if (err) err(e); } };
      const f = c => { if (c === '*' || c === colDe(p)) run(); }; ouvintes.add(f); run(); return () => ouvintes.delete(f);
    },
    collection: sub => colRef(p + '/' + sub),
  });
  const colRef = c => ({
    path: c, doc: id => docRef(c + '/' + (id || rid())),
    onSnapshot(next, err) {
      let ocupado = false, de_novo = false;
      const run = async () => {
        if (ocupado) { de_novo = true; return; } ocupado = true;
        try { const docs = (await lerCol(c)).map(r => snapDoc(r.path, r.data)); next({ docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] }); ok(); }
        catch (e) { console.warn(e); if (err) err(e); }
        finally { ocupado = false; if (de_novo) { de_novo = false; run(); } }
      };
      const f = cc => { if (cc === '*' || cc === c) run(); }; ouvintes.add(f); run(); return () => ouvintes.delete(f);
    },
  });
  let canal = null;
  function tempoReal() {
    if (canal) { SB.removeChannel(canal); canal = null; }
    if (!logado()) return;
    canal = SB.channel('manut-docs').on('postgres_changes', { event: '*', schema: 'public', table: T_DOCS }, ev => {
      const p = (ev.new && ev.new.path) || (ev.old && ev.old.path); avisar(p ? colDe(p) : '*');
    }).subscribe();
  }
  setInterval(() => { if (document.visibilityState === 'visible') avisar('*'); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') avisar('*'); });
  return { doc: docRef, collection: colRef, atualizar: () => { tempoReal(); avisar('*'); } };
}

/* fotos no Storage do Supabase */
async function enviarFoto(file) {
  const blob = await comprimir(file);
  const nome = `${S.authUser ? 'servicos' : 'solicitacoes'}/${dayStr().slice(0, 7)}/${rid()}.jpg`;
  const { error } = await SB.storage.from(BUCKET).upload(nome, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw erroSb(error);
  return { k: 's', id: nome };
}
async function fotoSrc(f) {
  if (!f) return null;
  if (f.k === 's') return SB.storage.from(BUCKET).getPublicUrl(f.id).data.publicUrl;
  if (fotoCache.has(f.id)) return fotoCache.get(f.id);
  const s = await S.db.doc('fotos/' + f.id).get(); const d = s.exists ? s.data().d : null;
  if (d) fotoCache.set(f.id, d); return d;
}

/* login com o Supabase Auth */
function sessaoValida() {
  const s = S.sessao; if (!s || s.modo !== S.modo) return false;
  if (s.modo === 'solicitante') return true;
  const p = papelDe(S.authUser);
  if (s.modo === 'equipe') return p === 'equipe' && (S.config.funcoes || []).includes(s.funcao);
  return p === 'gestor';
}
async function submitLogin(form) {
  const v = fv(form), a = S.loginAlvo, eq = a === 'equipe'; ocupado(form, 'Conferindo…');
  try {
    if (eq && !v.usuario) return mostrarErro(form, 'Escolha o seu usuário.');
    const email = eq ? emailFuncao(v.usuario) : normEmail(v.email);
    const { data, error } = await SB.auth.signInWithPassword({ email, password: v.senha });
    if (error) return mostrarErro(form, /invalid|credentials/i.test(error.message) ? (eq ? 'Senha incorreta.' : 'E-mail ou senha incorretos.') : 'Não foi possível entrar agora. Confira a conexão e tente de novo.');
    const papel = papelDe(data.user);
    if (eq ? papel !== 'equipe' : papel !== 'gestor') { await SB.auth.signOut(); return mostrarErro(form, eq ? 'Este usuário não é da equipe de manutenção.' : 'Este e-mail não tem acesso à coordenação.'); }
    S.authUser = data.user; S.uid = data.user.id; S.db.atualizar();
    if (eq) ls.set('mp.ultimaFuncao', v.usuario); else ls.set('mp.ultimoEmail', email);
    if (!eq && (data.user.user_metadata || {}).trocar_senha) { S.trocaSenha = { email, modo: a }; render(); return; }
    entrar(eq ? { modo: 'equipe', funcao: v.usuario } : { modo: a, email });
  } catch (e) { console.error(e); mostrarErro(form, 'Não foi possível entrar agora. Confira a conexão e tente de novo.'); }
}
async function submitTrocarSenha(form) {
  const v = fv(form), email = form.dataset.email, app = form.dataset.origem === 'app';
  if (v.nova.length < 6) return mostrarErro(form, 'A nova senha precisa ter pelo menos 6 caracteres.');
  if (v.nova === SENHA_PADRAO) return mostrarErro(form, 'Escolha uma senha diferente da senha inicial.');
  if (v.nova !== v.confirma) return mostrarErro(form, 'As duas senhas digitadas não são iguais.');
  ocupado(form, 'Salvando…');
  try {
    if (app) { const r = await SB.auth.signInWithPassword({ email, password: v.atual }); if (r.error) return mostrarErro(form, 'A senha atual está incorreta.'); }
    const { data, error } = await SB.auth.updateUser({ password: v.nova, data: { trocar_senha: false } });
    if (error) return mostrarErro(form, /different|same/i.test(error.message) ? 'Escolha uma senha diferente da atual.' : 'Não foi possível salvar a senha. Tente de novo.');
    if (data && data.user) S.authUser = data.user;
  } catch (e) { console.error(e); return mostrarErro(form, 'Não foi possível salvar a senha. Confira a conexão e tente de novo.'); }
  if (app) { closeModal(); toast('Senha alterada.'); }
  else { const m = S.trocaSenha.modo; entrar({ modo: m, email }); toast('Senha criada. Use-a nos próximos acessos.'); }
}
async function rpc(nome, args) { const { error } = await SB.rpc(nome, args); if (error) throw erroSb(error); }
async function submitSenhaEquipe(form) {
  const v = fv(form);
  if (v.nova.length < 6) return toast('A senha da equipe precisa ter pelo menos 6 caracteres.');
  if (await salvar(() => rpc('manut_definir_senha_equipe', { p_senha: v.nova }), 'Senha da equipe alterada. Avise os colaboradores.')) form.reset();
}
function sair() {
  if (S.sessao && S.sessao.temp) { S.sessao = lerSessao(); S.modo = S.sessao ? S.sessao.modo : null; S.view = null; history.replaceState(null, '', location.pathname); render(); return; }
  limparSessao(); S.membro = null; ls.del('mp.membro'); closeModal(); if (location.hash) location.hash = '';
  if (S.authUser) { S.authUser = null; S.uid = null; SB.auth.signOut().catch(() => {}); S.db.atualizar(); }
  render();
}
Object.assign(ACT, {
  sair: () => sair(),
  'trocar-modo': () => sair(),
  'voltar-inicio': () => { if (S.trocaSenha && S.authUser) { S.authUser = null; S.uid = null; SB.auth.signOut().catch(() => {}); S.db.atualizar(); } S.loginAlvo = null; S.trocaSenha = null; render(); },
  async 'senha-reset'(el) {
    const id = el.dataset.id, eq = id === 'equipe';
    if (!await confirmar('Redefinir senha', eq ? 'A senha da equipe volta a ser a senha inicial.' : `A senha de ${id} volta a ser a senha inicial, e no próximo acesso será pedida uma nova.`, 'Redefinir', true)) return;
    await salvar(() => eq ? rpc('manut_definir_senha_equipe', { p_senha: SENHA_PADRAO }) : rpc('manut_redefinir_senha', { p_email: id }), 'Senha redefinida para a senha inicial.');
  },
});
Object.assign(SUBMIT, { login: submitLogin, 'trocar-senha': submitTrocarSenha, 'senha-equipe': submitSenhaEquipe });

/* início */
async function init() {
  const cfg = String(window.SUPABASE_URL || '') + String(window.SUPABASE_ANON_KEY || '');
  if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || /COLE_AQUI/.test(cfg) || typeof supabase === 'undefined') {
    $('#app').innerHTML = `<div class="welcome center"><div class="logo"><img src="${LOGO_NEG}" alt="Dome"></div><h1>Configuração pendente</h1>
      <p class="muted" style="max-width:520px">${typeof supabase === 'undefined' ? 'A biblioteca do Supabase não carregou. Confira a conexão com a internet e recarregue a página.' : 'Preencha o arquivo <b>config.js</b> com a URL e a chave anon do seu projeto no Supabase e publique de novo no Netlify.'}</p></div>`;
    return;
  }
  render();
  SB = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'manut-auth' } });
  S.db = supaDb(); S.assets = null; S.downloads = null; S.canWrite = true; S.demo = false;
  try { const { data } = await SB.auth.getSession(); S.authUser = data && data.session ? data.session.user : null; } catch (e) { S.authUser = null; }
  S.uid = S.authUser ? S.authUser.id : null;
  SB.auth.onAuthStateChange((ev, sess) => {
    const u = sess ? sess.user : null;
    if (!u && S.authUser) { S.authUser = null; S.uid = null; if (S.modo && S.modo !== 'solicitante') limparSessao(); S.db.atualizar(); queueRender(); }
    else if (u) { S.authUser = u; S.uid = u.id; }
  });
  ls.del('mp.modo'); S.sessao = lerSessao(); S.modo = S.sessao ? S.sessao.modo : null; S.membro = ls.get('mp.membro');
  if (S.authUser && (S.modo === 'gestor' || S.modo === 'acompanhar') && (S.authUser.user_metadata || {}).trocar_senha) { S.trocaSenha = { email: S.authUser.email, modo: S.modo }; S.loginAlvo = S.modo; S.modo = null; }
  const qs = new URLSearchParams(location.search);
  if (qs.has('equip')) {
    const id = String(qs.get('equip') || '').trim().toUpperCase();
    if (S.modo && S.modo !== 'solicitante' && sessaoValida()) { ls.set('mp.irEquip', id); history.replaceState(null, '', location.pathname); }
    else return paginaEquipPublica(id);
  }
  if (qs.has('beb')) {
    const id = String(qs.get('beb') || '').trim().toUpperCase();
    if (S.modo && S.modo !== 'solicitante' && sessaoValida()) { ls.set('mp.irBeb', id); history.replaceState(null, '', location.pathname); }
    else return paginaBebPublica(id);
  }
  if (qs.has('solicitar')) { S.qrLocal = qs.get('local') || ''; if (S.modo !== 'solicitante') { S.sessao = { modo: 'solicitante', ts: Date.now(), temp: true }; S.modo = 'solicitante'; } S.view = 'nova'; }
  else { const h = location.hash.slice(1); if (h) S.view = h; }
  const timer = setTimeout(() => { if (!S.ready) { S.lento = true; render(); } }, 10000);
  const done = k => { S.loaded[k] = true; if (S.loaded.servicos && S.loaded.equipe && S.loaded.planos && S.loaded.config) { if (!S.ready) { S.ready = true; S.lento = false; clearTimeout(timer); render(); } else dataRender(); autoGerar(); } };
  const onErr = () => { S.lento = true; if (S.ready) queueRender(); };
  const lista = (nome, key) => col(nome).onSnapshot(sn => { S[key] = sn.docs.map(d => ({ ...d.data(), id: d.id })); done(key); }, onErr);
  lista('servicos', 'servicos'); lista('equipe', 'equipe'); lista('planos', 'planos');
  S.db.doc('config/geral').onSnapshot(sn => { S.configExists = sn.exists; S.config = { ...DEFAULT_CONFIG, ...(sn.exists ? sn.data() : {}) }; done('config'); }, onErr);
  if (typeof pmocInit === 'function') pmocInit();
  if (typeof bebInit === 'function') bebInit();
  S.db.atualizar();
}

init();
